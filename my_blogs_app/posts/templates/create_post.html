{% extends 'base.html' %}
{% load static %}

{% block content %}
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <style>
    .create-post {
      max-width: 760px;
      margin: 3rem auto;
      padding: 0 1.25rem;
      color: inherit;
    }

    .create-post__card {
      padding: clamp(1.5rem, 4vw, 2.5rem);
      border: 1px solid rgba(127, 127, 127, 0.2);
      border-radius: 1rem;
      background: var(--card-background, var(--surface-color, #fff));
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    }

    .create-post__intro {
      margin-bottom: 1.75rem;
    }

    .create-post__intro h1 {
      margin: 0 0 0.5rem;
    }

    .create-post__intro p {
      margin: 0;
      opacity: 0.75;
    }

    .create-post__form p {
      margin: 0 0 1.25rem;
    }

    .create-post__form label {
      display: block;
      margin-bottom: 0.45rem;
      font-weight: 600;
    }

    .create-post__form input:not([type="checkbox"]):not([type="radio"]),
    .create-post__form textarea,
    .create-post__form select {
      box-sizing: border-box;
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid rgba(127, 127, 127, 0.4);
      border-radius: 0.5rem;
      background: transparent;
      color: inherit;
      font: inherit;
    }

    .create-post__form textarea {
      min-height: 10rem;
      resize: vertical;
    }

    .create-post__form input:focus,
    .create-post__form textarea:focus,
    .create-post__form select:focus {
      outline: 2px solid var(--primary-color, #4f46e5);
      outline-offset: 2px;
    }

    .create-post__submit {
      padding: 0.75rem 1.25rem;
      border: 0;
      border-radius: 0.5rem;
      background: var(--primary-color, #4f46e5);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .create-post__submit:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    @media (max-width: 600px) {
      .create-post {
        margin: 1.5rem auto;
      }
    }
  </style>

  <main class="create-post">
    <section class="create-post__card" aria-labelledby="create-post-title">
      <header class="create-post__intro">
        <h1 id="create-post-title">Create a New Post</h1>
        <p>Share something new with the community.</p>
      </header>
      <form class="create-post__form" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="create-post__submit" type="submit">Publish Post</button>
      </form>
    </section>
  </main>
{% endblock %}
