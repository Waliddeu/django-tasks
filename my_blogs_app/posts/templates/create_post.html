{% extends "base.html" %}

{% block title %}Create Post | My Blog{% endblock %}

{% block content %}
<section class="surface form-card form-card--wide" aria-labelledby="create-post-title">
    <h1 class="h2" id="create-post-title">Create a new post</h1>
    <p class="meta mb-4">Share something new with the community.</p>
    <form method="post">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-primary" type="submit">Publish post</button>
            <a class="btn btn-outline-secondary" href="{% url 'posts' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
