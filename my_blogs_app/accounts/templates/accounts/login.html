{% extends "base.html" %}

{% block title %}Log in | My Blog{% endblock %}

{% block content %}
<section class="surface form-card" aria-labelledby="login-title">
    <h1 class="h2 text-center" id="login-title">Welcome back</h1>
    <p class="meta text-center mb-4">Log in to write posts and comment.</p>
    <form method="post">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>
    <p class="meta text-center mt-4 mb-0">New here? <a href="{% url 'register' %}">Create an account</a></p>
</section>
{% endblock %}
