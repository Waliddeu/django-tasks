<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        :root {
            --blog-ink: #202638;
            --blog-muted: #697386;
            --blog-accent: #5b52d6;
            --blog-line: #e8eaf0;
            --blog-bg: #f7f8fc;
            --blog-card: #fff;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background: var(--blog-bg);
            color: var(--blog-ink);
            font: 16px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        header {
            background: var(--blog-card);
            border-bottom: 1px solid var(--blog-line);
        }

        nav {
            width: min(1100px, calc(100% - 48px));
            min-height: 72px;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }

        nav a {
            color: var(--blog-ink);
            font-size: 1.3rem;
            font-weight: 750;
            letter-spacing: -.04em;
            text-decoration: none;
        }

        nav a:hover, main a:hover { color: var(--blog-accent); }

        main {
            width: min(900px, calc(100% - 48px));
            margin: 48px auto;
            flex: 1;
        }

        main h1, main h2, main h3 {
            color: var(--blog-ink);
            line-height: 1.25;
            letter-spacing: -.025em;
        }

        main h1 { font-size: clamp(2rem, 5vw, 2.8rem); }
        main p { color: var(--blog-muted); }
        main a { color: var(--blog-accent); text-decoration: none; }

        main article, main .post, main .blog-post {
            margin: 0 0 22px;
            padding: 26px 30px;
            background: var(--blog-card);
            border: 1px solid var(--blog-line);
            border-radius: 14px;
            box-shadow: 0 6px 24px rgb(32 38 56 / 4%);
        }

        footer {
            padding: 20px 24px;
            background: var(--blog-card);
            border-top: 1px solid var(--blog-line);
            color: var(--blog-muted);
            text-align: center;
        }

        footer p { margin: 0; font-size: .9rem; }

        @media (max-width: 600px) {
            nav, main { width: calc(100% - 32px); }
            main { margin: 30px auto; }
            main article, main .post, main .blog-post { padding: 20px; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'posts' %}">Posts</a>
            {% if user.is_authenticated %}
                <form method="post" action="{% url 'logout' %}" style="display:inline">
                    {% csrf_token %}
                    <button type="submit">Log out ({{ user.username }})</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log in</a>
                <a href="{% url 'register' %}">Sign up</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; {% now "Y" %} My Blog</p>
    </footer>
</body>
</html>
